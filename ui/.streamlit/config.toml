[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"

[server]
maxUploadSize = 1024   # MB; the per-minute sensor file is ~260 MB

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"   # no "Deploy" button for engineers
