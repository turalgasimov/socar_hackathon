# Each engineer picks light or dark in the app's Settings; the choice is stored in their own browser.
[theme.dark]   # SOCAR neutrals (socar.az); blue chosen so white button text and blue text on black both read
primaryColor = "#007fb2"
backgroundColor = "#121212"
secondaryBackgroundColor = "#232323"
textColor = "#f5f5f5"

[theme.light]
primaryColor = "#0077a6"
backgroundColor = "#f5f5f5"
secondaryBackgroundColor = "#e3e3e3"
textColor = "#232323"

[server]
maxUploadSize = 1024   # MB; the per-minute sensor file is ~260 MB

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"   # no "Deploy" button for engineers
